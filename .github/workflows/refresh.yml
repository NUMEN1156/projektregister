name: Register aktualisieren

# Takt: täglich 05:17 UTC. Zusätzlich von Hand auslösbar und immer dann,
# wenn sich Ziele oder Erhebungslogik ändern.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - targets.json
      - harvest.py
      - build.py

permissions:
  contents: write

concurrency:
  group: register-refresh
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow installieren
        run: python -m pip install --quiet --disable-pip-version-check pillow

      - name: Live-Metadaten erheben
        run: python harvest.py

      - name: Seite erzeugen
        run: python build.py

      - name: Änderungen festschreiben
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Keine Änderungen - Register ist unverändert."
            exit 0
          fi
          git config user.name "projektregister-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Register: Live-Werte vom $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Übertragen (Versuch $attempt)."
              exit 0
            fi
            sleep 7
          done
          echo "Übertragung nach drei Versuchen abgebrochen." >&2
          exit 1